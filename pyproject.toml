[project]
name = "retrieval-regression-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi[standard]==0.141.1",
    "openai==3.3.1",
    "pydantic-settings==2.15.0",
    "starlette==1.6.0",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "mypy==2.3.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff==0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is data, not code. Wrapping it would change what the model reads.
"src/harness/core/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name and import name differ, so hatchling cannot infer the package.
[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
